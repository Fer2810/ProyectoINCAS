<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Administrador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/formuA.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_administrador.css') }}">
</head>

<body>
    <button class="back-button" onclick="window.history.back();">
        <i class="fas fa-arrow-left"></i>
    </button>
    <div class="content">
        <h2>Editar Administrador</h2>
        <form action="" method="POST" enctype="multipart/form-data">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" value="{{ administrador[1] }}" required>

            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos" value="{{ administrador[2] }}" required>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" value="{{ administrador[3] }}" required>

            <label for="imagen">Imagen:</label>
            <div class="form-group">
                <input type="file" id="imagen" name="imagen">
                <div class="image-preview" id="imagePreview">
                    <img src="" alt="Vista previa de la imagen" class="image-preview__image" style="display: none;">
                    <span class="image-preview__default-text">Vista previa de la imagen</span>
                </div>
            </div>

            <input type="submit" value="Guardar cambios">
        </form>
    </div>

    <script>
        const inputImagen = document.getElementById('imagen');
        const previewContainer = document.getElementById('imagePreview');
        const previewImage = previewContainer.querySelector('.image-preview__image');
        const previewDefaultText = previewContainer.querySelector('.image-preview__default-text');

        inputImagen.addEventListener('change', function () {
            const file = this.files[0];

            if (file) {
                const reader = new FileReader();

                previewDefaultText.style.display = "none";
                previewImage.style.display = "block";

                reader.addEventListener('load', function () {
                    previewImage.setAttribute('src', this.result);
                });

                reader.readAsDataURL(file);
            } else {
                previewDefaultText.style.display = null;
                previewImage.style.display = "none";
                previewImage.setAttribute('src', '');
            }
        });
    </script>
</body>

</html>
