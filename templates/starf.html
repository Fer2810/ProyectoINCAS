<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/starf.css') }}">
    
    <title>VideoStreaming</title>

    <script language="JavaScript">
      function mueveReloj(){
          momentoActual = new Date()
          hora = momentoActual.getHours()
          minuto = momentoActual.getMinutes()
          segundo = momentoActual.getSeconds()
      
          str_segundo = new String (segundo)
          if (str_segundo.length == 1)
             segundo = "0" + segundo
      
          str_minuto = new String (minuto)
          if (str_minuto.length == 1)
             minuto = "0" + minuto
      
          str_hora = new String (hora)
          if (str_hora.length == 1)
             hora = "0" + hora
      
          horaImprimible = hora + " : " + minuto + " : " + segundo
      
          document.form_reloj.reloj.value = horaImprimible
      
          setTimeout("mueveReloj()",1000)
      }
      </script>

</head>
<body class="container" onload="mueveReloj()">

	<p id="fecha"></p>

	<script>
		 // Obtiene la fecha actual
		 var fechaActual = new Date();

		 // Obtiene el día, mes y año
		 var dia = fechaActual.getDate();
		 var mes = fechaActual.getMonth() + 1; // Los meses comienzan desde 0, así que sumamos 1
		 var año = fechaActual.getFullYear();

		 // Formatea la fecha como desees, por ejemplo, dd/mm/yyyy
		 var fechaFormateada = dia + '/' + mes + '/' + año;

		 // Muestra la fecha en el elemento HTML con el id "fecha"
		 document.getElementById("fecha").innerText = "La fecha actual es: " + fechaFormateada;
	</script>
    
  <form name="form_reloj" class="reloj">
    <input type="text" name="reloj" size="10" style="background-color: black; color: white; font-family: Verdana, Arial, Helvetica; font-size: 20px; text-align: center; border: none;" onfocus="window.document.form_reloj.reloj.blur()">
  </form>


    <center><h1 class="title">Toma de asistencia</h1></center>
    <div id="videoFrameContainer">
        <!-- Aquí está el video frame -->
        <img id="videoFrame" src="{{ url_for('video_feed') }}">
    </div>

    <div id="studentInfo" class="student-card" style="display:none;">
        <div class="svg-background"></div>
        <div class="svg-background2"></div>
        <div class="circle">
            <img id="studentPhoto" class="profile-img" style="width: 135px; height: 161px;">
        </div>
        <img class="menu-icon profile-img" src="/static/img/LogoIncasSin.png">
        <div class="text-container">
            <p class="title-text" id="nie">Nie</p>
            <p class="info-text" id="nombre">Nombre</p>
            <p class="desc-text" id="bachillerato">Bachillerato</p>
        </div>
    </div>

    <div id="studentInfoTextContainer">
        <p id="studentInfoText"></p>
    </div>
     
      <script>
        var studentList = []; // Array para mantener un registro de los estudiantes

        // Función para actualizar la lista de estudiantes
        // Mantener un conjunto para rastrear los estudiantes ya registrados
var registeredStudents = new Set();

// Función para actualizar la lista de estudiantes
function updateStudentList(studentInfo) {
    // Verificar si el estudiante ya está registrado
    if (!registeredStudents.has(studentInfo)) {
        // Obtener la hora y la fecha actual
        var now = new Date();
        var hora = now.getHours();
        var minuto = now.getMinutes();
        var segundo = now.getSeconds();
        var dia = now.getDate();
        var mes = now.getMonth() + 1; // Los meses comienzan desde 0, así que sumamos 1
        var año = now.getFullYear();

        // Formatear la hora y la fecha
        var formattedTime = hora + ":" + minuto + ":" + segundo;
        var formattedDate = dia + "/" + mes + "/" + año;

        // Crear la cadena con el nombre del estudiante, la hora y la fecha
        var studentInfoWithTime = studentInfo + " - Registrado el " + formattedDate + " a las " + formattedTime;

        // Agregar el estudiante al conjunto de estudiantes registrados
        registeredStudents.add(studentInfo);

        // Actualizar la lista de estudiantes en el HTML
        var listItem = document.createElement('li');
        listItem.textContent = studentInfoWithTime;
        document.getElementById('studentList').appendChild(listItem);
    }
}


        // Función para mostrar la información del estudiante actualizada
        function updateStudentInfo(studentInfo) {
            document.getElementById('studentInfoText').textContent = studentInfo;
        }

        // Crear un nuevo objeto EventSource que se conecte a la ruta /student_info
        var eventSource = new EventSource('/student_info');

        // Agregar un evento 'message' al objeto EventSource para manejar los mensajes recibidos
        eventSource.onmessage = function(event) {
            // Obtener el contenido del mensaje (student_info)
            var studentInfo = event.data;

            // Llamar a las funciones para actualizar la lista de estudiantes y la información del estudiante
            updateStudentList(studentInfo);
            updateStudentInfo(studentInfo);
        };

        // Agregar un evento 'error' para manejar errores de conexión
        eventSource.onerror = function(event) {
            console.error("Error en la conexión SSE:", event);
        }; 
    </script>
  
    

    <!-- Contenedor para los botones -->
    <div class="button-container">
        <!-- HTML para encender la cámara -->
        <form method="post">
            <button type="submit" class="btn btn-success" name="action" value="start_camera" onclick="hideStudentCard()">Iniciar Cámara</button>
        </form>

        <!-- HTML para apagar la cámara -->
        <form method="post">
            <button type="submit" class="btn btn-danger" name="action" value="stop_camera">Apagar Cámara</button>
        </form>

        <a href="/inicio" class="btn btn-info">Volver</a>

    </div>

    <!-- Script de EventSource -->
    <script>
        if (!!window.EventSource) {
            var source = new EventSource('/student_info');
            source.addEventListener('message', function(event) {
                var studentInfo = event.data;
                var infoArray = studentInfo.split(',');

                document.getElementById('nie').textContent = infoArray[0].trim();
                document.getElementById('nombre').textContent = infoArray[1].trim();
                document.getElementById('bachillerato').textContent = infoArray[2].trim();

                // Convertir la imagen de base64 a formato aceptado por el navegador
                var imageBase64 = infoArray[3].trim();
                document.getElementById('studentPhoto').src = 'data:image/jpeg;base64,' + imageBase64;

                document.getElementById('studentInfo').style.display = 'block';
                updateStudentList(infoArray[1].trim());
            }, false);
        } else {
            alert("Your browser does not support Server-Sent Events. Please update or use a different browser.");
        }
  </script>
    <!-- Sección para mostrar la lista de estudiantes -->
    <div id="studentListSection">
      <h2>Lista de Estudiantes:</h2>
      <ul id="studentList"></ul>
  </div>
</body>
</html>
