<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ayuda.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <main>
        <h1>Ayuda y Soporte Tecnico</h1>
        <hr class="linea">
        <br>
        <br>
    </main>

    <div class="container">
        <div class="sidebar">
            <div class="logo items">
                <img class="prin" src="IMG/OIG1 (1).jpeg" alt="">
                <span class="mainHead para">
                    <h4>STARF</h4>
                    <h5>Administracion</h5>
                </span>
            </div>
            <ul>
                <li class="items">
                    <i class="fas fa-house"></i>
                    <p class="para"><a href="/inicio">Inicio</a></p>
                </li>
                <li class="items">
                    <i class="fas fa-globe"></i>
                    <p class="para"><a href="/starf">Reconocimiento</a></p>
                </li>
                <li class="items">
                    <i class="fas fa-circle-exclamation"></i>
                    <p class="para"><a href="/masRecursos">Mas recursos</a></p>
                </li>
                <li class="items">
                    <i class="fas fa-envelope"></i>
                    <p class="para"><a href="/ayuda">Ayuda</a></p>
                </li>
            </ul>
        </div>

        <div class="content">
            <div class="contact-info">
                <div class="contact-item">
                    <h4>Contacto</h4>
                    <i class="fas fa-phone"></i>
                    <p>+503 2444-1018</p>
                </div>
                <div class="contact-item">
                    <h4>Redes Sociales</h4>
                    <i class="fab fa-facebook"></i>
                    <p>
                        <a href="https://www.facebook.com"></a>Instituto Nacional Cornelio Azenón Sierra</p>
                </div>
                <div class="contact-item">
                    <h4>Dirección</h4>
                    <i class="fas fa-map-marker-alt"></i>
                    <p>Final 3° Avenida Sur, 4 - 103, Atiquizaya, El Salvador, 503</p>
                </div>
            </div>
        </div>

        <div class="toggler">
            <i class="fas fa-bars" id="toggle-bars"></i>
            <i class="fas fa-xmark" id="toggle-cross"></i>
        </div>

        <img src="static/img/BackgroundEraser_20240411_130057254.png" class="right-image" alt="Imagen Derecha">
    </div>
</body>

</html>
