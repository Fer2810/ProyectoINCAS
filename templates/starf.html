<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/starf.css') }}">
    <title>VideoStreaming</title>

    <script language="JavaScript">
      function mueveReloj(){
          momentoActual = new Date()
          hora = momentoActual.getHours()
          minuto = momentoActual.getMinutes()
          segundo = momentoActual.getSeconds()
      
          str_segundo = new String (segundo)
          if (str_segundo.length == 1)
             segundo = "0" + segundo
      
          str_minuto = new String (minuto)
          if (str_minuto.length == 1)
             minuto = "0" + minuto
      
          str_hora = new String (hora)
          if (str_hora.length == 1)
             hora = "0" + hora
      
          horaImprimible = hora + " : " + minuto + " : " + segundo
      
          document.form_reloj.reloj.value = horaImprimible
      
          setTimeout("mueveReloj()",1000)
      }
      </script>

</head>
<body class="container" onload="mueveReloj()">

	<p id="fecha"></p>

	<script>
		 // Obtiene la fecha actual
		 var fechaActual = new Date();

		 // Obtiene el día, mes y año
		 var dia = fechaActual.getDate();
		 var mes = fechaActual.getMonth() + 1; // Los meses comienzan desde 0, así que sumamos 1
		 var año = fechaActual.getFullYear();

		 // Formatea la fecha como desees, por ejemplo, dd/mm/yyyy
		 var fechaFormateada = dia + '/' + mes + '/' + año;

		 // Muestra la fecha en el elemento HTML con el id "fecha"
		 document.getElementById("fecha").innerText = "La fecha actual es: " + fechaFormateada;
	</script>
    
  <form name="form_reloj" class="reloj">
    <input type="text" name="reloj" size="10" style="background-color: black; color: white; font-family: Verdana, Arial, Helvetica; font-size: 20px; text-align: center; border: none;" onfocus="window.document.form_reloj.reloj.blur()">
  </form>


    <center><h1 class="title">Toma de asistencia</h1></center>
     <!--<a href="{{ url_for('inicio') }}">Volver</a> <br><br>-->
   
    <!-- Aquí está la etiqueta img con el estilo CSS -->
    <img id="videoFrame" src="{{ url_for('video_feed') }}">


    <div id="studentInfo">

      <script>

        // Crear un nuevo objeto EventSource que se conecte a la ruta /student_info
        var eventSource = new EventSource('/student_info');


        // Agregar un evento 'message' al objeto EventSource para manejar los mensajes recibidos
        eventSource.onmessage = function(event) {
          // Obtener el contenido del mensaje (student_info)
          var studentInfo = event.data;

          // Actualizar el contenido del elemento HTML con id 'studentInfo'
          document.getElementById('studentInfo').innerHTML = studentInfo;
        };

        // Agregar un evento 'error' para manejar errores de conexión
        eventSource.onerror = function(event) {
          console.error("Error en la conexión SSE:", event);
        }; 
    </script>
  
    </div>


    <!-- Contenedor para los botones -->
    <div class="button-container">
        <!-- HTML para encender la cámara -->
        <form method="post">
            <button type="submit"  class="btn btn-success" name="action" value="start_camera">Iniciar Cámara</button>
        </form>

        <!-- HTML para apagar la cámara -->
        <form method="post">
            <button type="submit" class="btn btn-danger"  name="action" value="stop_camera">Apagar Cámara</button>
        </form>

        <a href="/inicio" class="btn btn-info">Volver</a>

    </div>
  
</body>
</html>
