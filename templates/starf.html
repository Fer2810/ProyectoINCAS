<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/starf.css') }}">
    <style>
        /* Estilos CSS adicionales aquí */

        /* Estilos para mantener el espacio a la derecha del video frame */
        #videoFrameContainer {
            position: relative;
            display: inline-block;
            margin-right: 20px; /* Espacio entre el video frame y la tarjeta del alumno */
        }

        /* Estilos para la tarjeta del alumno */
        .student-card {
            background-color: #d2d9dd;
            width: 400px;
            height: 240px;
            border-radius: 10px;
            overflow: hidden;
            position: absolute;
            top: 50%;
            right: -430px; /* Posición inicial fuera de la pantalla */
            transform: translateY(-50%);
            z-index: 999; /* Asegurar que esté por encima del video frame */
            transition: right 0.5s ease; /* Transición suave */
            margin-top: 9em;
            display: none; /* Ocultar la tarjeta por defecto */
        }

        .student-card .svg-background,
        .student-card .svg-background2 {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #284661;
            clip-path: polygon(0 0, 14% 0, 48% 100%, 0% 100%);
        }

        .student-card .svg-background2 {
            background-color: rgba(0,0,0,0.12);
            left: 20px;
            z-index: -1; /* Asegurar que esté detrás del contenido */
        }

        .student-card .profile-img {
            width: 130px;
            height: 150px;
            margin-top: 45px;
            margin-left: 3.3em;
            border-radius: 5%;
        }

        .student-card .circle {
            width: 142px;
            height: 161px;
            background-color: #ECEFF1;
            border-radius: 5%;
            margin-top: 40px;
            margin-left: 3em;
        }

        .student-card .text-container {
            margin-right: 50px;
            margin-top: 45px;
            margin-left: 3em;
            max-width: 230px;
            text-align: left;
            position: absolute;
            top: 0; /* Alinear el texto en la parte superior */
            left: 180px; /* Ajustar la posición del texto */
            color: #263238;
            font-size: 18px;
        }

        .student-card .title-text {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .student-card .info-text {
            margin-bottom: 10px;
        }

        .student-card .desc-text {
            font-size: 14px;
        }
    </style>
    <title>VideoStreaming</title>
</head>
<body>
    <center><h1 class="title">Toma de asistencia</h1></center>
    <div id="videoFrameContainer">
        <!-- Aquí está el video frame -->
        <img id="videoFrame" src="{{ url_for('video_feed') }}">
    </div>

    <div id="studentInfo" class="student-card">
        <!-- Elementos de la tarjeta del alumno -->
        <div class="svg-background"></div>
        <div class="svg-background2"></div>
        <div class="circle"></div>
        <img class="menu-icon profile-img" src="LogoIncasSin.png">
        <div class="text-container">
            <p class="title-text" id="nit">Nit</p>
            <p class="info-text" id="nombre">Nombre</p>
            <p class="desc-text" id="bachillerato">Bachillerato</p>
        </div>
    </div>

    <!-- Contenedor para los botones -->
    <div class="button-container">
        <!-- HTML para encender la cámara -->
        <form method="post">
            <button type="submit" class="btn btn-success" name="action" value="start_camera" onclick="hideStudentCard()">Iniciar Cámara</button>
        </form>

        <!-- HTML para apagar la cámara -->
        <form method="post">
            <button type="submit" class="btn btn-danger" name="action" value="stop_camera">Apagar Cámara</button>
        </form>

        <a href="/inicio" class="btn btn-info">Volver</a>
    </div>

    <!-- Tabla de estudiantes -->
    <table class="table table-bordered">
        <thead>
            <tr>
                <th scope="col">NIE</th>
                <th scope="col">Nombres</th>
                <th scope="col">Apellidos</th>
                <th scope="col">Grado</th>
                <th scope="col">Sección</th>
                <th scope="col">Fecha</th>
                <th scope="col">Hora</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>2454700</td>
                <td>Angel Gabriel</td>
                <td>Carias Alvanez</td>
                <td>3°</td>
                <td>K</td>
                <td>25/06/2024</td>
                <td>7:99</td>
            </tr>
            <tr>
                <td>241425</td>
                <td>Fernando Jose</td>
                <td>Tesorero Brito</td>
                <td>3°</td>
                <td>K</td>
                <td>25/06/2024</td>
                <td>7:00</td>
            </tr>
        </tbody>
    </table>

    <!-- Script de EventSource -->
    <script>
      var eventSource = new EventSource('/student_info');
  
      eventSource.onmessage = function(event) {
          var studentInfo = event.data;
          var infoArray = studentInfo.split(',');
  
          // Actualizar el contenido de la tarjeta del alumno
          document.getElementById('nit').innerText = infoArray[0].trim();
          document.getElementById('nombre').innerText = infoArray[1].trim();
          document.getElementById('bachillerato').innerText = infoArray[2].trim();
  
          // Mostrar la tarjeta del alumno
          var studentCard = document.getElementById('studentInfo');
          studentCard.style.display = 'block'; // Mostrar la tarjeta
      };
  
      eventSource.onerror = function(event) {
          console.error("Error en la conexión SSE:", event);
      };
  
      function hideStudentCard() {
          // Ocultar la tarjeta del alumno al presionar el botón para encender la cámara
          var studentCard = document.getElementById('studentInfo');
          studentCard.style.display = 'none'; // Ocultar la tarjeta
      }
  </script>
</body>
</html>
