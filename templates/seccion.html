<body>
    <div class="sidebar" id="sidebar">
        <h2>Administración</h2>
        <ul class="nav">
            <li><a href="#">Personal</a>
                <ul class="dropdown-content">
                    <li><a href="/profesor">Profesor</a></li>
                    <li><a href="/administrador">Administrador</a></li>
                    <li><a href="/formuB">Historial de Personal</a>
                        <ul class="dropdown-contents">
                            <li><a href="/formuB">Profesores</a></li>
                            <li><a href="/formuA">Administradores</a></li>
                        </ul>
                    </li>

                </ul>
            </li>
        </ul>
    </div>

    <button id="menu-toggle">&#9776;</button>

<!-- Formulario -->
<main>
    <h2>Secciones</h2>
    <form action="/submit_seccion" method="post">
        <!-- Columna 1 -->
        <div class="column">
            <!-- Contenedor para los campos de texto de nombre, NIP e ID de profesor -->
            <div class="field-container">
                <!-- Etiqueta y campo para el nombre -->
                <label for="id_seccion">ID Sección:</label>
                <input type="text" id="id_seccion" name="id_seccion" placeholder="ID Sección">
                <label for="bachillerato">Bachillerato:</label>
                <input type="text" id="bachillerato" name="bachillerato" placeholder="Bachillerato">
            </div>
        </div>
        <!-- Columna 2 -->
        <div class="column">
            <!-- Contenedor para los campos de texto de apellidos, correo electrónico y botón de guardar -->
            <div class="field-container">
                <!-- Etiqueta y campo para los apellidos -->
                <label for="seccion">Sección:</label>
                <input type="text" id="seccion" name="seccion" placeholder="Sección">
                <label for="año">Año:</label>
                <select id="año" name="año">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
                <!-- Botón de guardar -->
                <input type="submit" value="Guardar">
            </div>
        </div>
    </form>
</main>


    <!-- Script para la vista previa de la imagen -->
    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                var img = document.getElementById('file-preview');
                img.src = reader.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
    <script src="menu.js"></script>
</body>

</html>
