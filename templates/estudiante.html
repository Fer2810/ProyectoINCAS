<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STARF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estudiante.css') }}">
</head>

<body>
    <div class="sidebar" id="sidebar">
        <h2>Administración</h2>
        <ul class="nav">
            <li><a href="#">Personal</a>
                <ul class="dropdown-content">
                    <li><a href="/profesor">Profesor</a></li>
                    <li><a href="/administrador">Administrador</a></li>
                    <li><a href="#">Historial de Personal</a>
                        <ul class="dropdown-contents">
                            <li><a href="/formuP">Profesores</a></li>
                            <li><a href="/formuA">Administradores</a></li>
                        </ul>
                    </li>
                </ul>
            </li>
            <li><a href="/estudiante">Estudiante</a></li>
            <li><a href="/seccion">Secciones</a></li>
            <li><a href="/inicio">Tomar asistencia STARF</a></li>
            <li><a href="#">Reportes</a>
                <ul class="dropdown-content">
                    <li><a href="#">En Tiempo Real</a></li>
                    <li><a href="#">Normal</a></li>
                </ul>
            </li>
        </ul>
    </div>

    <button id="menu-toggle">&#9776;</button>


     <!-- Formulario -->
     <main>
        <h2>Registrar Estudiante</h2>
        <form action="/submit_estudiante" method="POST" enctype="multipart/form-data">
            <!-- Contenedor para la vista previa de la imagen -->
            <div id="file-container">
                <!-- Botón para agregar imagen -->
                <div class="file-upload-container">
                    <label for="foto" class="custom-file-upload"></label>
                    <input type="file" id="foto" name="imagen" accept="image/*" onchange="previewImage(event)">
                </div>
                <!-- Vista previa de la imagen -->
                <img id="file-preview" src="#" alt="Vista previa de la imagen">
            </div>
            <!-- Columna 1 -->
            <div class="column">
                <!-- Contenedor para los campos de texto de nombre, NIP e ID de profesor -->
                <div class="field-container">
                    <label for="NIE"></label>
                    <input type="text" id="nie" name="nit" placeholder="NIE">
                    <label for="nombre "></label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre">
                    <label for="genero">Género</label>
                    <select id="genero" name="genero">
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                    </select>
                    <br>

                </div>
            </div>
            <!-- Columna 2 -->
            <div class="column">
                <!-- Contenedor para los campos de texto de apellidos, correo electrónico y botón de guardar -->
                <div class="field-container">
                    <!-- Etiqueta y campo para los apellidos -->

                    
                    <label for="Apellido"></label>
                    <input type="text" id="Apellido" name="apellido" placeholder="Apellido">

                    <!-- Etiqueta y campo para el NIP -->
                    <label for="correo electronico"></label>
                    <input type="text" id="correo electronico" name="correo_electronico" placeholder="Correo electronico">
                    <label for="seccion">ID Sección</label>
                    <select id="seccion" name="seccion">
                        <option value=""></option>
                        <option value=""></option>
                        
                    </select>
                    
                    <!-- Botón de guardar -->
                    <input type="submit" value="Guardar">
                </div>
            </div>
        </form>
    </main>

    <!-- Script para la vista previa de la imagen -->
    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                var img = document.getElementById('file-preview');
                img.src = reader.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
    <script src="menu.js"></script>
</body>

</html>
