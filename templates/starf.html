<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoStreaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/starf.css') }}">
    <script language="JavaScript">
        function mueveReloj(){
            let momentoActual = new Date();
            let hora = momentoActual.getHours();
            let minuto = momentoActual.getMinutes();
            let segundo = momentoActual.getSeconds();

            let ampm = hora >= 12 ? 'PM' : 'AM';
            hora = hora % 12;
            hora = hora ? hora : 12; // La hora 0 debe ser 12

            let str_segundo = segundo < 10 ? "0" + segundo : segundo;
            let str_minuto = minuto < 10 ? "0" + minuto : minuto;
            let str_hora = hora < 10 ? "0" + hora : hora;

            let horaImprimible = str_hora + " : " + str_minuto + " : " + str_segundo + " " + ampm;

            document.form_reloj.reloj.value = horaImprimible;

            setTimeout(mueveReloj, 1000);
        }
    </script>
</head>
<body class="container" onload="mueveReloj()">
    <p id="fecha"></p>

    <script>
        // Obtiene la fecha actual
        var fechaActual = new Date();

        // Obtiene el día, mes y año
        var dia = fechaActual.getDate();
        var mes = fechaActual.getMonth() + 1; // Los meses comienzan desde 0, así que sumamos 1
        var año = fechaActual.getFullYear();

        // Formatea la fecha como desees, por ejemplo, dd/mm/yyyy
        var fechaFormateada = dia + '/' + mes + '/' + año;

        // Muestra la fecha en el elemento HTML con el id "fecha"
        document.getElementById("fecha").innerText = "La fecha actual es: " + fechaFormateada;
    </script>
    
    <form name="form_reloj" class="reloj">
        <input type="text" name="reloj" size="15" style="background-color: black; color: white; font-family: Verdana, Arial, Helvetica; font-size: 20px; text-align: center; border: none;" onfocus="window.document.form_reloj.reloj.blur()">
    </form>

    <center><h1 class="title">Toma de asistencia</h1></center>
    <div id="videoFrameContainer">
        <!-- Aquí está el video frame -->
        <img id="videoFrame" src="{{ url_for('video_feed') }}">
    </div>

    <div id="studentInfo" class="student-card" style="display:none;">
        <div class="svg-background"></div>
        <div class="svg-background2"></div>
        <div class="circle">
            <img id="studentPhoto" class="studentImg" style="width: 135px; height: 161px; border-radius: 5%">
        </div>
        <img class="menu-icon profile-img" src="/static/img/LogoIncasSin.png">
        <div class="text-container">
            <p class="title-text" id="nie"></p>
            <p class="info-text" id="nombre"></p>
            <p class="desc-text" id="genero"></p>
            <p class="desc-text" id="bachillerato"></p>
        </div>
    </div>

    <div class="button-container">
        <form method="post">
            <button type="submit" class="btn btn-success" name="action" value="start_camera" onclick="hideStudentCard()">Iniciar Cámara</button>
        </form>

        <form method="post">
            <button type="submit" class="btn btn-danger" name="action" value="stop_camera" onclick="stopRecognition()">Apagar Cámara</button>
        </form>

        <a href="/inicio" class="btn btn-info">Volver</a>
    </div>

    <script>
        var allStudentsData = []; // Lista para almacenar los datos de todos los estudiantes
        var registeredStudents = new Set();

        function updateStudentList(nie, nombre, genero, bachillerato) {
            if (!registeredStudents.has(nie)) {
                var now = new Date();
                var formattedTime = now.toLocaleTimeString();
                var formattedDate = now.toLocaleDateString();

                // Añadir lógica para determinar si es una entrada tardía
                var entradaTardia = false;
                var hour = now.getHours();
                var minute = now.getMinutes();

                if ((hour === 8 && minute >= 40 && minute <= 50) ||
                    (hour === 12 && minute >= 15 && minute <= 30)) {
                    entradaTardia = " Entrada Tardía";

                } 
                else{
                    entradaTardia = "Entrada a tiempo"
                }
                // Lista para registrar los alumnos presentes
                var studentInfoWithTime = `${nie}, ${nombre}, ${genero}, ${bachillerato}, ${formattedDate}, ${formattedTime}, ${entradaTardia}`;
                

                

                registeredStudents.add(nie);

                // Agregar todos los datos del estudiante a la lista
                var studentData = {
                    nie: nie,
                    nombre: nombre,
                    genero: genero,
                    bachillerato: bachillerato,
                    fecha: formattedDate,
                    hora: formattedTime,
                    entradaTardia: entradaTardia
                };
                allStudentsData.push(studentData);

                // Actualizar la tabla con los datos del estudiante
                var tableBody = document.querySelector('.table tbody');
                var newRow = document.createElement('tr');
                newRow.innerHTML = `
                    <td>${nie}</td>
                    <td>${nombre}</td>
                    <td>${genero}</td>
                    <td>${bachillerato}</td>
                    <td>${formattedDate}</td>
                    <td>${formattedTime}</td>
                    <td>${entradaTardia}</td>
                `;
                tableBody.appendChild(newRow);
            }
        }

        function stopRecognition() {
            // Llenar el campo oculto con los datos de todos los estudiantes
            var hiddenInput = document.getElementById('studentData');
            hiddenInput.value = JSON.stringify(allStudentsData);

            // Enviar formulario al servidor
            document.getElementById('studentForm').submit();
        }

        if (!!window.EventSource) {
            var source = new EventSource('/student_info');
            source.addEventListener('message', function(event) {
                var studentInfo = event.data;
                var infoArray = studentInfo.split(',');

                var nie = infoArray[0].trim();
                var nombre = infoArray[1].trim();
                var genero = infoArray[2].trim();
                var bachillerato = infoArray[3].trim();
                var imageBase64 = infoArray[4].trim();

                document.getElementById('nie').textContent = nie;
                document.getElementById('nombre').textContent = nombre;
                document.getElementById('genero').textContent = genero;
                document.getElementById('bachillerato').textContent = bachillerato;
                document.getElementById('studentPhoto').src = 'data:image/jpeg;base64,' + imageBase64;

                document.getElementById('studentInfo').style.display = 'block';
                updateStudentList(nie, nombre, genero, bachillerato, imageBase64);
            }, false);
        } else {
            alert("Your browser does not support Server-Sent Events. Please update or use a different browser.");
        }
    </script>
    
    <div id="studentListSection">
        <h2>Lista de Estudiantes:</h2>
        
    </div>

    <table class="table table-bordered">
        <thead>
          <tr>
            <th scope="col">NIE</th>
            <th scope="col">Nombre</th>
            <th scope="col">Género</th>
            <th scope="col">Bachillerato</th>
            <th scope="col">Fecha</th>
            <th scope="col">Hora</th>
            <th scope="col">Estado</th>
          </tr>
        </thead>
        <tbody>
          <!-- Aquí se insertarán las filas de estudiantes -->
        </tbody>
      </table>
</body>
</html>
