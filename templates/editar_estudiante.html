<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_estudiante.css') }}">
    <title>Editar Estudiante</title>
</head>

<body>
    <div class="container">
        <h2>Editar Estudiante: {{ estudiante[0] }} {{ estudiante[1] }}</h2>
        <form action="{{ url_for('editar_estudiante', nie=nie) }}" method="POST" enctype="multipart/form-data">
            <div class="form-column">
                <label for="imagen">Imagen:</label>
                <input type="file" name="imagen" id="imagen" accept="image/*" required>

                <label for="nie">NIE:</label>
                <input type="text" name="nie_edit" id="nie" value="{{ estudiante[2] }}" required>

                <label for="nombre">Nombre:</label>
                <input type="text" name="nombre" id="nombre" value="{{ estudiante[0] }}" required>
            </div>
            <div class="form-column">
                <label for="apellido">Apellido:</label>
                <input type="text" name="apellido" id="apellido" value="{{ estudiante[1] }}" required>

                <label for="email">Correo Electrónico:</label>
                <input type="email" name="email" id="email" value="{{ estudiante[3] }}" required>

                <label for="genero">Género:</label>
                <select name="genero" id="genero" required>
                    <option value="Masculino" {% if estudiante[4]=="Masculino" %}selected{% endif %}>Masculino</option>
                    <option value="Femenino" {% if estudiante[4]=="Femenino" %}selected{% endif %}>Femenino</option>
                </select>

                <label for="bachillerato">Bachillerato:</label>
                <input type="text" name="bachillerato" id="bachillerato" value="{{ estudiante[5] }}" required>
            </div>
            <button type="submit">Actualizar</button>
        </form>
    </div>
</body>

</html>
