    <title>VideoStreaming</title>

    <script language="JavaScript">
      function mueveReloj(){
          momentoActual = new Date()
          hora = momentoActual.getHours()
          minuto = momentoActual.getMinutes()
          segundo = momentoActual.getSeconds()
      
          str_segundo = new String (segundo)
          if (str_segundo.length == 1)
             segundo = "0" + segundo
      
          str_minuto = new String (minuto)
          if (str_minuto.length == 1)
             minuto = "0" + minuto
      
          str_hora = new String (hora)
          if (str_hora.length == 1)
             hora = "0" + hora
      
          horaImprimible = hora + " : " + minuto + " : " + segundo
      
          document.form_reloj.reloj.value = horaImprimible
      
          setTimeout("mueveReloj()",1000)
      }
      </script>

</head>
<body class="container" onload="mueveReloj()">

	<p id="fecha"></p>

	<script>
		 // Obtiene la fecha actual
		 var fechaActual = new Date();

		 // Obtiene el día, mes y año
		 var dia = fechaActual.getDate();
		 var mes = fechaActual.getMonth() + 1; // Los meses comienzan desde 0, así que sumamos 1
		 var año = fechaActual.getFullYear();

		 // Formatea la fecha como desees, por ejemplo, dd/mm/yyyy
		 var fechaFormateada = dia + '/' + mes + '/' + año;

		 // Muestra la fecha en el elemento HTML con el id "fecha"
		 document.getElementById("fecha").innerText = "La fecha actual es: " + fechaFormateada;
	</script>
